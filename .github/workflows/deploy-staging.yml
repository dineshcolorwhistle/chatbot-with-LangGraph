name: Deploy to agentwhistle (aichat-staging)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    environment: aichat-staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python Syntax
        run: |
          python -m py_compile backend/app/main.py

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            set -e

            PROJECT_DIR="/home/agentwhistle-aichat-langgraph/htdocs/aichat-langgraph.agentwhistle.com/chatbot-with-LangGraph"

            echo "➡️ Switching to project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "➡️ Marking directory as safe for git..."
            git config --global --add safe.directory "$PROJECT_DIR" || true
            git config --global init.defaultBranch main || true

            if [ ! -d ".git" ]; then
              echo "📦 Initializing git repository..."
              git init -b main
            fi

            echo "🔄 Setting git remote origin URL..."
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2>/dev/null || git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

            echo "🔄 Force updating code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            if [ -f "scripts/deploy.sh" ]; then
              echo "🚀 Executing scripts/deploy.sh..."
              bash scripts/deploy.sh
            else
              echo "⚙️ Setting up backend..."
              cd backend
              if [ ! -d "venv" ]; then
                python3 -m venv venv
              fi
              source venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
              
              if systemctl list-unit-files | grep -q "aichat-backend.service"; then
                sudo systemctl restart aichat-backend
              fi
            fi

            echo "🎉 Deployment completed successfully!"
